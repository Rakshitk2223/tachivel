# Tachivel on the Oracle box. Everything listens on 127.0.0.1 only; Caddy (on the host) is the one public door.
# All data lives under /srv/tachivel, the 30 GB Tachivel disk (see setup-storage.sh).
#   cd deploy && docker compose up -d --build
# Image tags: pin exact versions in .env on first deploy (see README), then bump on purpose.
# Each piece gets its own network: Suwayomi runs third-party extension code, so it must not be able to reach the app or the login.
name: tachivel

networks:
  app: {}
  comics: {}
  auth: {}

services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment:
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:?set UPLOAD_TOKEN in deploy/.env}
      PROXY_SECRET: ${PROXY_SECRET:?set PROXY_SECRET in deploy/.env (same value Caddy sends)}
      # The novel's weekly build reaches Netlify from the office laptop; the app copies it here (deploy/add-netlify-mirror.sh).
      NETLIFY_SITE: https://tachivel.netlify.app
      NETLIFY_PASSPHRASE: ${NETLIFY_PASSPHRASE:-}
    networks: [app]
    volumes:
      - /srv/tachivel/app:/data
    ports:
      - "127.0.0.1:47620:8080"
    mem_limit: 256m

  # The comics engine: runs your Keiyoushi extensions, checks for new chapters, downloads, keeps comic progress.
  # Settings passed here override the in-app ones on every restart, so only the fixed wiring lives here.
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:${SUWAYOMI_TAG:-v2.4.2435}
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      JAVA_TOOL_OPTIONS: -Xmx1g          # a JVM takes all the RAM it's allowed; other apps share this box
      WEB_UI_ENABLED: "false"            # Tachivel is the interface; Suwayomi's own web UI isn't needed
      FLARESOLVERR_ENABLED: "true"
      FLARESOLVERR_URL: http://flaresolverr:8191
      FLARESOLVERR_RESPONSE_AS_FALLBACK: "true"
    volumes:
      - /srv/tachivel/suwayomi:/home/suwayomi/.local/share/Tachidesk
    ports:
      - "127.0.0.1:4567:4567"
    mem_limit: 1536m
    networks: [comics]
    depends_on: [flaresolverr]

  # Gets past Cloudflare bot checks for sources like Asura. Headless Chrome, so it's capped.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:${FLARESOLVERR_TAG:-v3.5.1}
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      LOG_LEVEL: info
    mem_limit: 1g
    networks: [comics]

  # The login in front of everything: Google (your Gmail only) or username + password. Tinyauth v5 setting names.
  tinyauth:
    image: ghcr.io/steveiliop56/tinyauth:${TINYAUTH_TAG:-v5.0.6}
    restart: unless-stopped
    user: "1000:1000"                    # the image defaults to root; it doesn't need it
    environment:
      TINYAUTH_APPURL: https://auth.rakshiit.me
      TINYAUTH_AUTH_USERS: ${TINYAUTH_USERS:?set TINYAUTH_USERS (run deploy/init-env.sh)}
      TINYAUTH_AUTH_SECURECOOKIE: "true"
      TINYAUTH_AUTH_SESSIONEXPIRY: "7776000"   # 90 days, so each device signs in about once a season
      TINYAUTH_OAUTH_WHITELIST: ${ALLOWED_EMAIL:?set ALLOWED_EMAIL}
      TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTID: ${GOOGLE_CLIENT_ID:-}
      TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTSECRET: ${GOOGLE_CLIENT_SECRET:-}
      TINYAUTH_DATABASE_PATH: /data/tinyauth.db
      TINYAUTH_ANALYTICS_ENABLED: "false"
    volumes:
      - /srv/tachivel/auth:/data
    networks: [auth]
    ports:
      - "127.0.0.1:47630:3000"
